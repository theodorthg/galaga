<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121631"/><stop offset="1" stop-color="#05060c"/>
    </linearGradient>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#4db2ff" stroke-opacity="0.18" stroke-width="2"/>

  <text x="450" y="76" text-anchor="middle" font-size="32" font-weight="700" fill="#eef4ff">Schwierigkeitsstufen</text>
  <text x="450" y="112" text-anchor="middle" font-size="22" fill="#8fa3c8">Wie aggressiv Gegner aus der Formation angreifen</text>

  <text x="450" y="170" text-anchor="middle" font-size="24" font-weight="700" fill="#4db2ff">Angriffstempo</text>

  <!-- Leicht -->
  <g>
    <text x="165" y="222" text-anchor="middle" font-size="28" font-weight="700" fill="#5be6a0">Leicht</text>
    <rect x="143" y="250" width="44" height="230" rx="12" fill="#0d1226" stroke="#5be6a0" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="143" y="415" width="44" height="65" rx="10" fill="#5be6a0"/>
    <text x="165" y="512" text-anchor="middle" font-size="22" fill="#8fa3c8">selten</text>
  </g>

  <!-- Normal -->
  <g>
    <text x="450" y="222" text-anchor="middle" font-size="28" font-weight="700" fill="#4db2ff">Normal</text>
    <rect x="428" y="250" width="44" height="230" rx="12" fill="#0d1226" stroke="#4db2ff" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="428" y="342" width="44" height="138" rx="10" fill="#4db2ff"/>
    <text x="450" y="512" text-anchor="middle" font-size="22" fill="#8fa3c8">regelmäßig</text>
  </g>

  <!-- Schwer -->
  <g>
    <text x="735" y="222" text-anchor="middle" font-size="28" font-weight="700" fill="#ff6b57">Schwer</text>
    <rect x="713" y="250" width="44" height="230" rx="12" fill="#0d1226" stroke="#ff6b57" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="713" y="270" width="44" height="210" rx="10" fill="#ff6b57"/>
    <text x="735" y="512" text-anchor="middle" font-size="22" fill="#8fa3c8">ständig</text>
  </g>

  <rect x="60" y="548" width="780" height="2" fill="#4db2ff" fill-opacity="0.2"/>

  <text x="450" y="594" text-anchor="middle" font-size="24" font-weight="700" fill="#4db2ff">Gleichzeitige Angreifer</text>

  <!-- Leicht: 1 diver -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy2_trim.png" x="125" y="630" width="80" height="64"/>

  <!-- Normal: 2 divers -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy2_trim.png" x="363" y="630" width="80" height="64"/>
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy2_trim.png" x="457" y="630" width="80" height="64"/>

  <!-- Schwer: 3 divers -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy2_trim.png" x="600" y="630" width="80" height="64"/>
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy2_trim.png" x="688" y="630" width="80" height="64"/>
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy2_trim.png" x="776" y="630" width="80" height="64"/>

  <text x="165" y="726" text-anchor="middle" font-size="22" fill="#8fa3c8">wenige</text>
  <text x="450" y="726" text-anchor="middle" font-size="22" fill="#8fa3c8">mehrere</text>
  <text x="735" y="726" text-anchor="middle" font-size="22" fill="#8fa3c8">viele</text>

  <rect x="60" y="762" width="780" height="2" fill="#4db2ff" fill-opacity="0.2"/>

  <text x="450" y="822" text-anchor="middle" font-size="28" font-weight="700" fill="#eef4ff">Ändert nur Tempo &amp; Anzahl der Sturzflüge</text>
  <text x="450" y="858" text-anchor="middle" font-size="22" fill="#8fa3c8">Punkte, Leben und Fluggeschwindigkeit bleiben gleich</text>
  <text x="450" y="894" text-anchor="middle" font-size="20" fill="#8fa3c8">In den Einstellungen jederzeit umstellbar</text>
</svg>
