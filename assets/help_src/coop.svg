<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121631"/><stop offset="1" stop-color="#05060c"/>
    </linearGradient>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#4db2ff" stroke-opacity="0.18" stroke-width="2"/>

  <text x="450" y="70" text-anchor="middle" font-size="32" font-weight="700" fill="#eef4ff">2 players: Play &gt; 2 Players</text>
  <text x="450" y="112" text-anchor="middle" font-size="24" fill="#8fa3c8">turns: each loses a ship, the other one plays</text>
  <text x="450" y="144" text-anchor="middle" font-size="24" fill="#8fa3c8">co-op: both fly at once, one team score</text>

  <rect x="60" y="176" width="780" height="2" fill="#4db2ff" fill-opacity="0.2"/>

  <!-- two ships -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/player_trim.png" x="230" y="206" width="100" height="123"/>
  <g transform="translate(570 206)">
    <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/help_src/player_p2.png" x="0" y="0" width="100" height="123"/>
  </g>
  <text x="280" y="364" text-anchor="middle" font-size="28" font-weight="700" fill="#eef4ff">Player 1</text>
  <text x="620" y="364" text-anchor="middle" font-size="28" font-weight="700" fill="#9dffb8">Player 2</text>

  <!-- keys -->
  <g font-size="24" fill="#eef4ff">
    <rect x="120" y="400" width="320" height="170" rx="14" fill="#4db2ff" fill-opacity="0.08" stroke="#4db2ff" stroke-opacity="0.4"/>
    <text x="280" y="440" text-anchor="middle" font-weight="700">Keyboard</text>
    <text x="280" y="482" text-anchor="middle" fill="#8fa3c8">move: A  D</text>
    <text x="280" y="520" text-anchor="middle" fill="#8fa3c8">fire: Space / W</text>
    <text x="280" y="554" text-anchor="middle" fill="#8fa3c8">or a gamepad</text>
    <rect x="460" y="400" width="320" height="170" rx="14" fill="#4db2ff" fill-opacity="0.08" stroke="#4db2ff" stroke-opacity="0.4"/>
    <text x="620" y="440" text-anchor="middle" font-weight="700">Keyboard</text>
    <text x="620" y="482" text-anchor="middle" fill="#8fa3c8">move: arrow keys</text>
    <text x="620" y="520" text-anchor="middle" fill="#8fa3c8">fire: Up / K</text>
    <text x="620" y="554" text-anchor="middle" fill="#8fa3c8">or a gamepad</text>
  </g>
  <text x="450" y="614" text-anchor="middle" font-size="22" fill="#8fa3c8">Before the game each player presses fire on their own device</text>

  <rect x="60" y="650" width="780" height="2" fill="#4db2ff" fill-opacity="0.2"/>

  <!-- rescue -->
  <g transform="translate(150 690)">
    <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy4_trim.png" x="0" y="0" width="90" height="102"/>
    <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/ship_captured.png" x="16" y="82" width="58" height="61"/>
  </g>
  <line x1="300" y1="760" x2="440" y2="760" stroke="#4db2ff" stroke-width="6"/>
  <path d="M440 744 L470 760 L440 776 z" fill="#4db2ff"/>
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/help_src/player_p2.png" x="520" y="700" width="90" height="111"/>
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/player_trim.png" x="620" y="700" width="90" height="111"/>
  <text x="450" y="880" text-anchor="middle" font-size="28" font-weight="700" fill="#eef4ff">Your partner can free a captured ship</text>
  <text x="450" y="918" text-anchor="middle" font-size="22" fill="#8fa3c8">by shooting the Boss that carries it — even if you</text>
  <text x="450" y="946" text-anchor="middle" font-size="22" fill="#8fa3c8">have no ships left. Game over when nobody can fly.</text>
</svg>
