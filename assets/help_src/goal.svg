<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121631"/><stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4db2ff"/>
    </marker>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#4db2ff" stroke-opacity="0.18" stroke-width="2"/>

  <text x="60" y="70" font-size="30" font-weight="700" fill="#eef4ff">Enemies &amp; Points</text>

  <!-- Boss row -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy4_trim.png" x="60" y="96" width="72" height="81"/>
  <text x="160" y="130" font-size="30" fill="#eef4ff">Flagship</text>
  <text x="160" y="164" font-size="26" fill="#4db2ff" font-weight="700">150 points</text>

  <!-- Goei row -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy3_trim.png" x="60" y="196" width="72" height="71"/>
  <text x="160" y="222" font-size="30" fill="#eef4ff">Butterfly</text>
  <text x="160" y="256" font-size="26" fill="#4db2ff" font-weight="700">80 points</text>

  <!-- Zako row -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy2_trim.png" x="60" y="296" width="72" height="58"/>
  <text x="160" y="322" font-size="30" fill="#eef4ff">Bee</text>
  <text x="160" y="356" font-size="26" fill="#4db2ff" font-weight="700">50 points</text>

  <!-- extra formation dots to the right, suggesting the full 40-slot block -->
  <g fill="#4db2ff" fill-opacity="0.5">
    <circle cx="460" cy="120" r="10"/><circle cx="500" cy="120" r="10"/><circle cx="540" cy="120" r="10"/><circle cx="580" cy="120" r="10"/><circle cx="620" cy="120" r="10"/><circle cx="660" cy="120" r="10"/><circle cx="700" cy="120" r="10"/><circle cx="740" cy="120" r="10"/>
    <circle cx="460" cy="225" r="10"/><circle cx="500" cy="225" r="10"/><circle cx="540" cy="225" r="10"/><circle cx="580" cy="225" r="10"/><circle cx="620" cy="225" r="10"/><circle cx="660" cy="225" r="10"/><circle cx="700" cy="225" r="10"/><circle cx="740" cy="225" r="10"/>
    <circle cx="460" cy="330" r="10"/><circle cx="500" cy="330" r="10"/><circle cx="540" cy="330" r="10"/><circle cx="580" cy="330" r="10"/><circle cx="620" cy="330" r="10"/><circle cx="660" cy="330" r="10"/><circle cx="700" cy="330" r="10"/><circle cx="740" cy="330" r="10"/>
  </g>

  <rect x="40" y="410" width="820" height="2" fill="#4db2ff" fill-opacity="0.2"/>

  <!-- caption above the diving enemy, clear of the sprite and its path -->
  <text x="790" y="450" font-size="26" fill="#8fa3c8" text-anchor="end">dives down,</text>
  <text x="790" y="480" font-size="26" fill="#8fa3c8" text-anchor="end">drops bombs</text>

  <!-- diving enemy with a curved path -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/enemy2_trim.png" x="668" y="500" width="60" height="48"/>
  <path d="M698 552 C 620 600, 560 650, 470 720" fill="none" stroke="#4db2ff" stroke-opacity="0.55" stroke-width="4" stroke-dasharray="10 8"/>
  <!-- bomb -->
  <g transform="translate(555 660)">
    <polygon points="0,-16 10,0 0,16 -10,0" fill="#ffd23f"/>
    <circle cx="0" cy="0" r="4" fill="#fff6cf"/>
  </g>

  <!-- lasers going up from the ship -->
  <g fill="#cfefff">
    <rect x="400" y="700" width="6" height="60"/>
    <rect x="444" y="682" width="6" height="78"/>
  </g>

  <!-- ship -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/player_trim.png" x="360" y="760" width="120" height="148"/>

  <text x="450" y="932" text-anchor="middle" font-size="28" font-weight="700" fill="#eef4ff">Dodge &amp; shoot back</text>
  <text x="450" y="964" text-anchor="middle" font-size="24" fill="#8fa3c8">Whole formation cleared = next stage</text>
</svg>
