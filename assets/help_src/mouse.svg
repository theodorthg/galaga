<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121631"/><stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3358"/><stop offset="1" stop-color="#12162a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#4db2ff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- mouse illustration -->
  <g transform="translate(450 320)">
    <path d="M0 -140
             C -84 -140, -114 -70, -114 10
             L -114 96
             C -114 176, -60 216, 0 216
             C 60 216, 114 176, 114 96
             L 114 10
             C 114 -70, 84 -140, 0 -140 Z"
          fill="url(#mouseBody)" stroke="#4db2ff" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M0 -140 L 0 -20" stroke="#4db2ff" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M-108 -20 C -60 -34, 60 -34, 108 -20" fill="none" stroke="#4db2ff" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="-12" y="-108" width="24" height="72" rx="10" fill="#4db2ff" fill-opacity="0.7"/>
  </g>

  <!-- move / aim arrow -->
  <g stroke="#4db2ff" stroke-width="5" fill="#4db2ff">
    <line x1="230" y1="620" x2="670" y2="620"/>
    <path d="M230 620 l 30 -16 l 0 32 Z"/>
    <path d="M670 620 l -30 -16 l 0 32 Z"/>
  </g>
  <text x="450" y="674" text-anchor="middle" font-size="34" font-weight="700" fill="#eef4ff">Move  =  Aim</text>
  <text x="450" y="710" text-anchor="middle" font-size="26" fill="#8fa3c8">the ship follows the cursor 1:1</text>

  <!-- left click callout -->
  <g stroke="#5c6b86" stroke-width="2" fill="none">
    <path d="M110 260 L 336 300"/>
  </g>
  <circle cx="336" cy="300" r="6" fill="#4db2ff"/>
  <text x="60" y="220" font-size="32" font-weight="700" fill="#eef4ff">Left click</text>
  <text x="60" y="256" font-size="26" fill="#8fa3c8">hold = autofire</text>

  <!-- ship at bottom -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/player_trim.png" x="385" y="750" width="130" height="160"/>
  <text x="450" y="944" text-anchor="middle" font-size="24" fill="#8fa3c8">keyboard/gamepad keep working alongside</text>
</svg>
