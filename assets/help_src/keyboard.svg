<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121631"/><stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3358"/><stop offset="1" stop-color="#161a30"/>
    </linearGradient>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#4db2ff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- MOVE -->
  <g transform="translate(60 50)">
    <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="32" y="43" text-anchor="middle" font-size="30" fill="#eef4ff">&#8592;</text>
    <rect x="74" y="0" width="64" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="106" y="43" text-anchor="middle" font-size="30" fill="#eef4ff">&#8594;</text>
    <text x="164" y="40" font-size="26" fill="#8fa3c8">or</text>
    <rect x="256" y="0" width="64" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="288" y="43" text-anchor="middle" font-size="27" fill="#eef4ff">A</text>
    <rect x="332" y="0" width="64" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="364" y="43" text-anchor="middle" font-size="27" fill="#eef4ff">D</text>
    <text x="0" y="112" font-size="32" font-weight="700" fill="#eef4ff">Move — left / right</text>
  </g>

  <!-- SHOOT -->
  <g transform="translate(60 190)">
    <rect x="0" y="0" width="176" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="88" y="41" text-anchor="middle" font-size="23" fill="#eef4ff">Space</text>
    <text x="196" y="40" font-size="26" fill="#8fa3c8">or</text>
    <rect x="288" y="0" width="64" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="320" y="43" text-anchor="middle" font-size="30" fill="#eef4ff">&#8593;</text>
    <text x="0" y="112" font-size="32" font-weight="700" fill="#eef4ff">Shoot</text>
    <text x="0" y="146" font-size="26" fill="#8fa3c8">hold = autofire</text>
  </g>

  <rect x="40" y="356" width="820" height="2" fill="#4db2ff" fill-opacity="0.18"/>

  <!-- GAMEPAD -->
  <text x="450" y="398" text-anchor="middle" font-size="26" font-weight="700" fill="#eef4ff">Gamepad</text>

  <!-- D-pad: one solid cross, not four loose squares - reads as a real D-pad
       at a glance. Only left/right actually steer the ship (this game has no
       vertical movement) - up/down are still drawn since that's what a real
       D-pad looks like, the caption to the right calls out which ones do
       something. -->
  <g transform="translate(230 412)">
    <path d="M36 0 H72 V36 H108 V72 H72 V108 H36 V72 H0 V36 H36 Z"
          fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#eef4ff" font-size="24" font-weight="700" text-anchor="middle">
      <text x="54" y="28">^</text>
      <text x="54" y="98">v</text>
      <text x="18" y="61">&lt;</text>
      <text x="90" y="61">&gt;</text>
    </g>
  </g>

  <!-- Only A and B are real bound actions (Godot's ui_accept/ui_cancel plus
       Galaga's own "shoot") - a third/fourth decorative face button would
       mismatch real controllers, whose diamond layouts disagree on what sits
       where (Xbox: Y top, Nintendo: X top, ...). A confirms the focused menu
       button (or shoots in-game), B always backs out of a menu - both work
       at once, not a contradiction. -->
  <g transform="translate(380 427)">
    <circle cx="20" cy="20" r="18" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="20" y="27" text-anchor="middle" font-size="20" fill="#eef4ff" font-weight="700">A</text>
  </g>
  <g transform="translate(380 475)">
    <circle cx="20" cy="20" r="18" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="20" y="27" text-anchor="middle" font-size="20" fill="#eef4ff" font-weight="700">B</text>
  </g>

  <g fill="#8fa3c8" font-size="24">
    <text x="460" y="434">D-pad left / right to steer</text>
    <text x="460" y="468">A to shoot</text>
    <text x="460" y="502">A to confirm menus</text>
    <text x="460" y="536">B to cancel / go back</text>
  </g>

  <rect x="40" y="566" width="820" height="2" fill="#4db2ff" fill-opacity="0.18"/>

  <!-- PAUSE -->
  <g transform="translate(60 596)">
    <rect x="0" y="0" width="86" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="43" y="41" text-anchor="middle" font-size="23" fill="#eef4ff">Esc</text>
    <text x="106" y="40" font-size="26" fill="#8fa3c8">or</text>
    <rect x="198" y="0" width="64" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="230" y="43" text-anchor="middle" font-size="27" fill="#eef4ff">P</text>
    <text x="282" y="40" font-size="26" fill="#8fa3c8">or</text>
    <rect x="334" y="0" width="110" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="389" y="38" text-anchor="middle" font-size="19" fill="#eef4ff">Start</text>
    <text x="0" y="112" font-size="32" font-weight="700" fill="#eef4ff">Pause</text>

    <!-- MUTE, sharing the Pause row: a mockup of the actual frosted-glass
         HUD button (speaker cone + sound-wave arcs, same hand-drawn shape as
         mute_icon.gd) so the control is shown, not just named - plus its
         key/gamepad bindings, same "key box" style as the rest of the page. -->
    <g transform="translate(500 0)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#4db2ff" stroke-opacity="0.6" stroke-width="2"/>
      <polygon points="22.9,27.45 28.75,27.45 36.55,19 36.55,45 28.75,36.55 22.9,36.55" fill="#eef4ff"/>
      <path d="M43.81 22.01 A12.35 12.35 0 0 1 43.81 41.99" fill="none" stroke="#eef4ff" stroke-width="2" stroke-linecap="round"/>
      <path d="M46.87 17.80 A17.55 17.55 0 0 1 46.87 46.20" fill="none" stroke="#eef4ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="574" y="40" font-size="26" fill="#8fa3c8">or</text>
    <rect x="610" y="0" width="64" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="642" y="43" text-anchor="middle" font-size="27" fill="#eef4ff">M</text>
    <text x="684" y="40" font-size="26" fill="#8fa3c8">or</text>
    <rect x="720" y="0" width="100" height="64" rx="10" fill="url(#key)" stroke="#4db2ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="770" y="38" text-anchor="middle" font-size="18" fill="#eef4ff">Select</text>
    <text x="500" y="112" font-size="32" font-weight="700" fill="#eef4ff">Mute</text>
    <text x="500" y="146" font-size="22" fill="#8fa3c8">toggles all sound</text>
  </g>

  <!-- ship + thruster glow -->
  <g>
    <ellipse cx="450" cy="950" rx="80" ry="22" fill="#4db2ff" fill-opacity="0.12"/>
    <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/player_trim.png" x="360" y="749" width="180" height="221"/>
  </g>
</svg>
