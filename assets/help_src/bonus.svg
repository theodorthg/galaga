  <text x="450" y="878" text-anchor="middle" font-size="30" font-weight="700" fill="#4db2ff">Laps 1</text>
  <text x="450" y="916" text-anchor="middle" font-size="24" fill="#4db2ff" font-weight="700">+2500 bonus points, laps counter +1</text>
  <text x="450" y="950" text-anchor="middle" font-size="22" fill="#8fa3c8">row clears afterwards, keep collecting</text>
