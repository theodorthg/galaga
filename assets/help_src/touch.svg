<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="980" viewBox="0 0 900 980" font-family="DejaVu Sans, 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121631"/><stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4db2ff"/>
    </marker>
  </defs>
  <rect width="900" height="980" fill="url(#bg)"/>
  <rect x="14" y="14" width="872" height="952" rx="18" fill="none" stroke="#4db2ff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- phone screen -->
  <rect x="230" y="60" width="440" height="740" rx="28" fill="#0a0d1c" stroke="#2c3560" stroke-width="4"/>
  <rect x="256" y="96" width="388" height="668" rx="6" fill="#0d1226"/>

  <!-- pause button top-right, matching the real HUD -->
  <rect x="576" y="122" width="52" height="44" rx="8" fill="#4db2ff" fill-opacity="0.22" stroke="#4db2ff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="602" y="153" text-anchor="middle" font-size="26" fill="#eef4ff">| |</text>
  <g stroke="#5c6b86" stroke-width="2" fill="none"><path d="M700 210 L 615 168"/></g>
  <text x="800" y="222" text-anchor="end" font-size="26" fill="#8fa3c8">Pause button</text>

  <!-- drag arrow across the board -->
  <g stroke="#4db2ff" stroke-width="7" fill="none">
    <line x1="316" y1="430" x2="584" y2="430" marker-start="url(#ah)" marker-end="url(#ah)"/>
  </g>
  <circle cx="316" cy="430" r="26" fill="#d9e6ff" fill-opacity="0.14" stroke="#d9e6ff" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="316" cy="430" r="8" fill="#eef4ff"/>

  <!-- ship following -->
  <image xlink:href="file:///home/bernd/GodotDev/learn_2d_gamedev_godot_4_0.57.0_linux/projects/galaga/assets/graphics/player_trim.png" x="400" y="560" width="100" height="123"/>

  <text x="450" y="852" text-anchor="middle" font-size="32" font-weight="700" fill="#eef4ff">Drag anywhere — steers the ship</text>

  <!-- finger-down = fire -->
  <g transform="translate(90 900)">
    <circle cx="26" cy="0" r="28" fill="#d9e6ff" fill-opacity="0.14" stroke="#d9e6ff" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="26" cy="0" r="8" fill="#eef4ff"/>
    <text x="76" y="-6" font-size="28" font-weight="700" fill="#eef4ff">Hold finger — autofire</text>
    <text x="76" y="26" font-size="24" fill="#8fa3c8">release stops instantly</text>
  </g>
</svg>
